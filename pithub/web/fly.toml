# pithub 웹 (Fly.io)
app = "pithub-web"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"
  # NEXT_PUBLIC_* 값은 `fly deploy --build-arg NEXT_PUBLIC_SUPABASE_URL=... ` 등으로 넘긴다

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
