# Supabase Local Development Configuration
# https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

[auth]
enabled = true
site_url = "env(PITHUB_WEB_URL)"
additional_redirect_urls = ["env(PITHUB_WEB_URL)/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.external.github]
enabled = true
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[analytics]
enabled = false

# 로그인 메일 (한국어, 코드 우선 — 링크는 요청한 브라우저에서만 열린다). 운영은 대시보드
# Authentication → Emails 에 같은 내용을 넣는다: 제목 "pithub 로그인 코드" / "pithub 가입 확인 코드".
[auth.email.template.magic_link]
subject = "pithub 로그인 코드"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "pithub 가입 확인 코드"
content_path = "./supabase/templates/confirmation.html"
