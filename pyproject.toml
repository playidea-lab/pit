[project]
name = "pit"
version = "0.1.0"
description = "Product / Idea Tracker - 기획/아이디어/결정/체크리스트를 Git처럼 버전 관리하고, git의 실제 코드와 비교하여 정합도를 평가하는 PM용 관제 시스템"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "changmin", email = "changmin@playidea.io" }
]
keywords = ["cli", "project-management", "version-control", "planning"]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "anthropic>=0.75.0",
    "python-dotenv>=1.2.1",
    "mcp>=1.23.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
pit = "pit.cli.main:app"
pit-mcp = "pit.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]
