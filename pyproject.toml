[project]
name = "pit"
version = "0.1.0"
description = "AI가 같은 실수를 두 번 하지 않게 하는 교정 메모리 — 결정 원장, MCP 서버, CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "changmin", email = "changmin@playidea.io" }
]
keywords = ["mcp", "decision-log", "ai-memory", "claude", "codex"]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "anthropic>=0.75.0",
    "python-dotenv>=1.2.1",
    "mcp>=1.23.3",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
server = [
    "fastmcp>=2.12",
]

[project.scripts]
pit = "pit.cli.main:app"
pit-mcp = "pit.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pit"]
# 추출·트윈 프롬프트는 코드가 아니라 데이터다. 빠지면 실행 시점에야 터지므로 명시한다.
artifacts = ["pit/twin/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: wheel 빌드처럼 오래 걸리는 테스트",
    "integration: 로컬 Supabase 등 외부 서비스가 필요한 테스트",
]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]
