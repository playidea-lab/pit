title: pithub 웹 서비스
description: >
  github.com/user/repo를 pithub.io/user/repo로 바꾸면
  해당 repo의 .pit/ 내용을 기획자 친화적으로 보여주는 웹 서비스
status: planned
priority: high
created_at: 2025-12-12T21:15:00+09:00
updated_at: 2025-12-12T21:15:00+09:00

context: >
  개발자는 GitHub에서 코드를 보고, 기획자는 pithub에서 기획을 본다.
  .pit/ 폴더의 Features, Decisions, Logs를 웹으로 시각화.
  GitHub Pages처럼 정적 사이트 생성 또는 동적 렌더링.

requirements:
  - github.com → pithub.io URL 변환
  - .pit/ 폴더 내용 파싱 및 렌더링
  - Feature 목록/상세 페이지
  - Decision 목록/상세 페이지
  - 프로젝트 헬스 대시보드
  - GitHub 연동 (repo 접근)

acceptance_criteria:
  - pithub.io/user/repo 접속 시 해당 repo의 .pit/ 내용 표시
  - Feature 카드 형태로 목록 표시
  - 진행률, 상태 시각화
  - 모바일 반응형

