# CI — 단위 테스트 · 린트 · 접근 권한(RLS)·PostgREST 통합 테스트 · 웹 빌드 · main 이면 운영 배포
name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  # 손으로 전부 다시 배포할 때 (Actions 화면 또는 `gh workflow run ci --ref main`)
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 서버 저장소(SupabaseRepository)의 쿼리를 진짜 PostgREST로 — 스키마는 시험이 만든 뒤 NOTIFY로 다시 읽힌다
      postgrest:
        image: postgrest/postgrest:v12.2.3
        env:
          PGRST_DB_URI: postgresql://postgres:ci@postgres:5432/postgres
          PGRST_DB_ANON_ROLE: anon
          PGRST_DB_SCHEMAS: public
          PGRST_JWT_SECRET: ci-only-postgrest-jwt-secret-0123456789
        ports: ["3000:3000"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra server
      - run: uv run ruff check pit tests
      - run: uv run pytest -q
      - name: RLS + PostgREST integration tests (migration on Postgres 17 + Supabase stub)
        env:
          PITHUB_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
          PITHUB_TEST_POSTGREST_URL: http://127.0.0.1:3000
          PITHUB_TEST_POSTGREST_JWT_SECRET: ci-only-postgrest-jwt-secret-0123456789
        run: uv run pytest -q -m integration
      - name: Wheel contains bundled prompts
        run: uv run pytest -q -m slow

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pithub/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pithub/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # 빌드에는 값의 존재만 필요하다. 진짜 값은 배포 시 build-arg로 들어간다.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  # main 에 들어온 변경을 운영에 올린다 — 시험이 모두 통과한 뒤, 바뀐 부분만, 한 번에 하나씩.
  # "바뀐 부분"은 직전 push 가 아니라 마지막으로 성공한 배포(태그 deployed/prod)와 비교한다:
  # 취소된 대기 실행 · 시험 실패로 건너뛴 push · 실패한 배포의 변경도 다음 배포에 실린다.
  # 순서: DB 확장 → 서버 → 웹. 열·테이블을 지우는(contract) 마이그레이션은 첫 줄에 `-- deploy: after-server`
  # 를 달아 서버 배포 뒤로 미룬다 — 옛 서버가 지워진 열을 계속 쓰는 동안 저장이 깨지지 않게 (2026-09-25 consulted).
  # 운영 DB에 아직 없는 마이그레이션에 확장과 contract 가 섞이면 순서를 지킬 수 없으니 배포를 멈춘다.
  deploy:
    needs: [python, web]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    permissions:
      contents: write # 배포 성공 뒤 deployed/prod 태그를 옮긴다
    env:
      # 공개값: 프로젝트 ref · 세션 풀러 호스트(러너에 IPv6가 없어 직접 연결 대신) · anon 키(브라우저에 실리는 값)
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # 웹이 연결 안내에 보여 주는 MCP 서버 주소 (빌드 때 박힌다 — 빠지면 연결 명령이 빈 주소로 나간다)
      PITHUB_MCP_URL: ${{ vars.PITHUB_MCP_URL }}
      DEPLOYED_TAG: deployed/prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What changed since the last successful deploy
        id: changed
        env:
          # 비밀값은 여기서 "있는지"만 본다 — 값은 쓰는 단계에만 넘긴다
          HAS_FLY_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
          HAS_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
        run: |
          base=$(git rev-parse -q --verify "refs/tags/$DEPLOYED_TAG" || true)
          # 이미 더 새 커밋이 배포됐는데 옛 실행을 다시 돌리면 운영이 뒤로 간다 — 아무것도 하지 않는다
          if [ -n "$base" ] && [ "$base" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$base"; then
            echo "::warning::더 새 커밋($base)이 이미 배포돼 있어 이 실행은 배포하지 않습니다"
            printf 'db=false\nserver=false\nweb=false\nready=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 손으로 돌렸거나, 성공한 배포가 없거나, 그 커밋이 지금 기록에 없으면(강제 push) 전부 배포한다
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$GITHUB_SHA"; then
            echo "기준: 전체"
            files=$(git ls-files)
          else
            echo "기준: $base"
            files=$(git diff --name-only "$base" "$GITHUB_SHA")
          fi
          # 어떤 마이그레이션을 어떤 순서로 적용할지는 뒤에서 운영 DB에 "아직 없는 것"을 보고 정한다
          migrations=$(echo "$files" | grep '^pithub/supabase/migrations/.*\.sql$' || true)
          {
            echo "db=$([ -n "$migrations" ] && echo true || echo false)"
            echo "server=$(echo "$files" | grep -qE '^(pit/|Dockerfile$|fly\.toml$|pyproject\.toml$|uv\.lock$)' && echo true || echo false)"
            echo "web=$(echo "$files" | grep -q '^pithub/web/' && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          missing=""
          [ "$HAS_FLY_TOKEN" = "true" ] || missing="$missing FLY_API_TOKEN"
          [ "$HAS_DB_PASSWORD" = "true" ] || missing="$missing SUPABASE_DB_PASSWORD"
          for name in SUPABASE_PROJECT_REF SUPABASE_POOLER_HOST SUPABASE_ANON_KEY PITHUB_MCP_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          # 배포 설정이 비었으면(포크·설정 전) 배포하지 않고 경고만 남긴다 — 뒤의 출력이 앞의 것을 덮는다
          if [ -n "$missing" ]; then
            echo "::warning::배포 설정이 비어 배포를 건너뜁니다:$missing"
            printf 'db=false\nserver=false\nweb=false\nready=false\n' >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: steps.changed.outputs.server == 'true' || steps.changed.outputs.web == 'true'
      - uses: supabase/setup-cli@adc7f6c42cdd496c1c01bd3d49bd1c9f7da9630d
        if: steps.changed.outputs.db == 'true'
        with:
          version: 2.109.1
      - name: DB connection
        if: steps.changed.outputs.db == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # 계정 전체 권한인 Supabase 액세스 토큰 대신 DB 비밀번호 하나로 마이그레이션만 한다 (비밀번호는 퍼센트 인코딩)
          password=$(jq -rn --arg v "$SUPABASE_DB_PASSWORD" '$v|@uri')
          echo "::add-mask::$password"
          echo "DB_URL=postgresql://postgres.$SUPABASE_PROJECT_REF:$password@$SUPABASE_POOLER_HOST:5432/postgres" >> "$GITHUB_ENV"
      - name: Pending migrations
        id: pending
        if: steps.changed.outputs.db == 'true'
        working-directory: pithub
        run: |
          # 운영 DB에 아직 없는 마이그레이션만 본다 — 전체 배포라도 이미 적용된 옛 contract 파일에 끌려가지 않는다
          pending=$(supabase migration list --db-url "$DB_URL" --output-format json | jq -r '.migrations[] | select((.remote // "") == "") | .local')
          contract=0
          expand=0
          for version in $pending; do
            f=$(ls supabase/migrations/"$version"_*.sql)
            if head -1 "$f" | grep -q '^-- deploy: after-server'; then contract=$((contract + 1)); else expand=$((expand + 1)); fi
          done
          echo "적용 안 된 마이그레이션: 확장 $expand · contract $contract"
          if [ "$contract" -gt 0 ] && [ "$expand" -gt 0 ]; then
            echo "::error::확장 마이그레이션과 contract(after-server)가 함께 적용 대기 중입니다. 따로 배포하세요."
            exit 1
          fi
          echo "expand=$([ "$expand" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "contract=$([ "$contract" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: DB migrations (expand — before the server)
        if: steps.pending.outputs.expand == 'true'
        working-directory: pithub
        run: supabase db push --yes --db-url "$DB_URL"
      - name: MCP server
        if: steps.changed.outputs.server == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
      - name: DB migrations (contract — after the server)
        if: steps.pending.outputs.contract == 'true'
        working-directory: pithub
        run: supabase db push --yes --db-url "$DB_URL"
      - name: Web
        if: steps.changed.outputs.web == 'true'
        working-directory: pithub/web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="https://$SUPABASE_PROJECT_REF.supabase.co" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --build-arg NEXT_PUBLIC_PITHUB_MCP_URL="$PITHUB_MCP_URL"
      - name: Mark deployed
        if: steps.changed.outputs.ready == 'true'
        run: |
          # 앞 단계가 모두 성공했을 때만 여기까지 온다 — 다음 배포의 비교 기준
          git tag -f "$DEPLOYED_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$DEPLOYED_TAG"
