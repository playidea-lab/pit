# CI — 단위 테스트 · 린트 · 접근 권한(RLS)·PostgREST 통합 테스트 · 웹 빌드 · main 이면 운영 배포
name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 서버 저장소(SupabaseRepository)의 쿼리를 진짜 PostgREST로 — 스키마는 시험이 만든 뒤 NOTIFY로 다시 읽힌다
      postgrest:
        image: postgrest/postgrest:v12.2.3
        env:
          PGRST_DB_URI: postgresql://postgres:ci@postgres:5432/postgres
          PGRST_DB_ANON_ROLE: anon
          PGRST_DB_SCHEMAS: public
          PGRST_JWT_SECRET: ci-only-postgrest-jwt-secret-0123456789
        ports: ["3000:3000"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra server
      - run: uv run ruff check pit tests
      - run: uv run pytest -q
      - name: RLS + PostgREST integration tests (migration on Postgres 17 + Supabase stub)
        env:
          PITHUB_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
          PITHUB_TEST_POSTGREST_URL: http://127.0.0.1:3000
          PITHUB_TEST_POSTGREST_JWT_SECRET: ci-only-postgrest-jwt-secret-0123456789
        run: uv run pytest -q -m integration
      - name: Wheel contains bundled prompts
        run: uv run pytest -q -m slow

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pithub/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pithub/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # 빌드에는 값의 존재만 필요하다. 진짜 값은 배포 시 build-arg로 들어간다.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  # main 에 들어온 변경을 운영에 올린다 — 시험이 모두 통과한 뒤, 바뀐 부분만, 한 번에 하나씩.
  # 순서: DB 확장 → 서버 → 웹. 열·테이블을 지우는(contract) 마이그레이션은 첫 줄에 `-- deploy: after-server`
  # 를 달아 서버 배포 뒤로 미룬다 — 옛 서버가 지워진 열을 계속 쓰는 동안 저장이 깨지지 않게 (2026-09-25 consulted).
  deploy:
    needs: [python, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # 공개값: 프로젝트 ref · 세션 풀러 호스트(러너에 IPv6가 없어 직접 연결 대신) · anon 키(브라우저에 실리는 값)
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What changed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # 새 브랜치 첫 push 등 이전 커밋이 없으면 전부 배포한다
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          migrations=$(echo "$files" | grep '^pithub/supabase/migrations/.*\.sql$' || true)
          echo "db=$([ -n "$migrations" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          contract=false
          for f in $migrations; do
            [ -f "$f" ] && head -1 "$f" | grep -q '^-- deploy: after-server' && contract=true
          done
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "server=$(echo "$files" | grep -qE '^(pit/|Dockerfile$|fly\.toml$|pyproject\.toml$|uv\.lock$)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$(echo "$files" | grep -q '^pithub/web/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # 배포 비밀이 아직 없으면(포크·설정 전) 배포하지 않고 경고만 남긴다 — 뒤의 출력이 앞의 것을 덮는다
          if [ -z "$FLY_API_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_POOLER_HOST" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::배포 설정(secrets FLY_API_TOKEN · SUPABASE_DB_PASSWORD, vars SUPABASE_PROJECT_REF · SUPABASE_POOLER_HOST · SUPABASE_ANON_KEY)이 없어 배포를 건너뜁니다"
            printf 'db=false\nserver=false\nweb=false\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.changed.outputs.server == 'true' || steps.changed.outputs.web == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.db == 'true'
        with:
          version: 2.109.1
      - name: DB connection
        if: steps.changed.outputs.db == 'true'
        run: |
          # 계정 전체 권한인 Supabase 액세스 토큰 대신 DB 비밀번호 하나로 마이그레이션만 한다 (비밀번호는 퍼센트 인코딩)
          password=$(jq -rn --arg v "$SUPABASE_DB_PASSWORD" '$v|@uri')
          echo "::add-mask::$password"
          echo "DB_URL=postgresql://postgres.$SUPABASE_PROJECT_REF:$password@$SUPABASE_POOLER_HOST:5432/postgres" >> "$GITHUB_ENV"
      - name: DB migrations (expand — before the server)
        if: steps.changed.outputs.db == 'true' && steps.changed.outputs.contract == 'false'
        working-directory: pithub
        run: supabase db push --yes --db-url "$DB_URL"
      - name: MCP server
        if: steps.changed.outputs.server == 'true'
        run: flyctl deploy --remote-only
      - name: DB migrations (contract — after the server)
        if: steps.changed.outputs.db == 'true' && steps.changed.outputs.contract == 'true'
        working-directory: pithub
        run: supabase db push --yes --db-url "$DB_URL"
      - name: Web
        if: steps.changed.outputs.web == 'true'
        working-directory: pithub/web
        run: |
          flyctl deploy --remote-only \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="https://$SUPABASE_PROJECT_REF.supabase.co" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
